[package]
name = "sovereign-core"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "sovereign_core"
crate-type = ["cdylib", "rlib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "sovereign-core-exe"
path = "src/main.rs"

[dependencies]
# 使用稳定且包含 async 核心支持的版本
suppftp = { version = "6.0", default-features = false, features = ["async", "native-tls"] }
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1.8", features = ["v4"] }
rust-embed = "8.2.0"
mime_guess = "2.0.4"
