name: SovereignNote 自动构建与 Release 发布流水线

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*' # 当推送以 v 开头的标签（例如 v2.1.0）时，触发自动发布流程
  workflow_dispatch:

# 强制对齐 Node 24 隔离环境，消除 Node 20 弃用警告
env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  RUST_VERSION: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 核心权限配置：必须显式声明写权限，否则 GITHUB_TOKEN 无法创建 Release
permissions:
  contents: write

jobs:

# ==================== 1. 前端资源打包 ====================
  build-frontend:
    name: 📦 编译 Web 前端资产
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 检出当前存储库源代码
        uses: actions/checkout@v4

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ⚡ 依赖安装与前端工程化生产打包
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 💾 暂存前端打包产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 1


# ==================== 2. WINDOWS 端编译 ====================
  build-windows:
    name: 🪟 编译 Windows 原生桌面端
    needs: build-frontend
    runs-on: windows-2022
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc] # 双架构并行编译
    steps:
      - name: 🚀 检出当前存储库源代码
        uses: actions/checkout@v4

      - name: 📥 载入暂存的前端打包资产
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: 🛠️ 配置并对齐 Rust 稳定版交叉编译工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: 🧼 物理清理旧依赖残余
        shell: pwsh
        run: |
          cd core-backend
          if (Test-Path "Cargo.lock") { Remove-Item "Cargo.lock" -Force }
          if (Test-Path "target") { Remove-Item "target" -Recurse -Force -ErrorAction SilentlyContinue }

      - name: 🔄 强力拉取纯净依赖
        shell: pwsh
        run: |
          cd core-backend
          cargo fetch --target ${{ matrix.target }}

      - name: ⚡ 执行 Windows 二进制单文件硬核构筑
        shell: pwsh
        run: |
          cd core-backend
          cargo build --release --target ${{ matrix.target }} --bin sovereign-core-exe
          $SourcePath = "target/${{ matrix.target }}/release/sovereign-core-exe.exe"
          if (Test-Path $SourcePath) {
            if ("${{ matrix.target }}" -like "*x86_64*") {
              Copy-Item $SourcePath target/${{ matrix.target }}/release/SovereignNote_Windows_x64.exe -Force
            } else {
              Copy-Item $SourcePath target/${{ matrix.target }}/release/SovereignNote_Windows_ia32.exe -Force
            }
          } else {
            Write-Error "错误：编译未生成有效产物，请检查上游 Cargo 编译日志！"
            exit 1
          }

      - name: 💾 暂存 Windows 编译程序
        uses: actions/upload-artifact@v4
        with:
          name: SovereignNote_Windows_${{ matrix.target }}
          path: core-backend/target/${{ matrix.target }}/release/SovereignNote_Windows_*.exe
          retention-days: 1


# ==================== 3. ANDROID 端编译 ====================
  build-android:
    name: 🤖 编译 Capacitor 原生 Android 端
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 检出当前存储库源代码
        uses: actions/checkout@v4

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ 配置 Java 21 基座环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📥 载入暂存的前端打包资产
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: ⚙️ 安装环境与同步 Capacitor
        run: |
          npm install --legacy-peer-deps
          npx cap sync android

      - name: ☕ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: 🧼 暴力重构并净化所有 Android 坏图资产 (绝对路径版)
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          echo "=== 1. 在本地生成一张绝对纯净、合规的母版 PNG 图片 ==="
          # 使用 $GITHUB_WORKSPACE 绝对路径确保母版存放位置固定
          convert -size 512x512 xc:transparent -fill "#4F46E5" -draw "circle 256,256 256,40" "$GITHUB_WORKSPACE/master_clean.png"
          
          echo "=== 2. 强制用健康母版重写所有报错的资源文件 ==="
          # 切换到 Android 资源根目录
          cd android/app/src/main/res/
          
          # 找出所有名存实亡的 png 文件，直接用母版图片进行强行覆盖
          find . -name "*.png" -print | while read img; do
            echo "正在物理重造并格式化: $img"
            # 这里使用绝对路径并保留原始尺寸
            convert "$GITHUB_WORKSPACE/master_clean.png" -resize $(identify -ping -format "%wx%h" "$img" 2>/dev/null || echo "128x128") "$img"
          done
          
          echo "=== 3. 终极验证 ==="
          identify mipmap-mdpi/ic_launcher.png
          
          echo "=== 资源全部强力洗牌完毕，准备进行 Gradle 编译 ==="

      - name: ⚡ 构建 Android APK 原生包 (Debug/Release)
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew assembleDebug

      - name: 💾 暂存 Android 安装包
        uses: actions/upload-artifact@v4
        with:
          name: SovereignNote_Android_APK
          path: android/app/build/outputs/apk/
          retention-days: 1


# ==================== 4. 自动化发布到 GITHUB RELEASE ====================
  publish-release:
    name: 🚀 聚合所有资产并全自动发布到 GitHub Releases
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 检出当前存储库源代码
        uses: actions/checkout@v4

      - name: 📥 载入暂存的所有构建资产
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 🔄 重新整理并重命名打包文件
        run: |
          mkdir release_assets
          # 提取资源并忽略路径结构
          find artifacts -name "SovereignNote_Windows_x64.exe" -exec cp {} release_assets/ \;
          find artifacts -name "SovereignNote_Windows_ia32.exe" -exec cp {} release_assets/ \;
          # 提取并重命名 Android APK 包
          find artifacts -name "app-debug.apk" -exec cp {} release_assets/SovereignNote_Android_Debug.apk \;
          find artifacts -name "app-release-unsigned.apk" -exec cp {} release_assets/SovereignNote_Android_Release_Unsigned.apk \;
          ls -lh release_assets/

      - name: 🟢 确立发布的 Tag 版本名称
        id: get_tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: ⚔️ 创建 Release 并上传所有资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          files: |
            release_assets/SovereignNote_Windows_x64.exe
            release_assets/SovereignNote_Windows_ia32.exe
            release_assets/SovereignNote_Android_Debug.apk
            release_assets/SovereignNote_Android_Release_Unsigned.apk
          name: SovereignNote 主权笔记 ${{ steps.get_tag.outputs.TAG_NAME }} 正式发布版
          body: |
            ## ⚔️ SovereignNote 主权笔记 ${{ steps.get_tag.outputs.TAG_NAME }}
            
            本版本由 GitHub Actions 自动化流水线多架构矩阵全自动编译生成。
            
            ### 📦 本次发布资产列表：
            * \`SovereignNote_Windows_x64.exe\` (Windows 64位桌面原生单文件程序)
            * \`SovereignNote_Windows_ia32.exe\` (Windows 32位桌面程序，支持老旧设备)
            * \`SovereignNote_Android_Debug.apk\` (Android 移动端测试包，推荐直接安装体验)
            * \`SovereignNote_Android_Release_Unsigned.apk\` (Android 移动端未签名包，需自行签名后部署)
            
            ### 🛠️ 核心功能与优化更新说明：
            1. **双端无缝同步**：支持 WebDAV 端口与自定义根文件夹解析，云端数据随时备份。新增安卓移动端独立的数据中心 IP 同步绑定支持。
            2. **原生移动架构优化**：大幅升级 Android 原生端，采用全新的 UI 桥接内核取代命令行核心容器，直接内置独立视图解决全屏安装后白屏或无法正确映射访问内网路由端口及无效404的系统异常架构问题。
            3. **文件夹级联分类**：完美支持笔记多级文件夹归类，侧边栏联动统计。
            4. **高性能 SQLite 内核**：解决 Windows 下的 \`E0505\` 生命周期锁，运行极速顺滑。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
