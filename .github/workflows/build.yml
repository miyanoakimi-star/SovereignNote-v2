name: SovereignNote v2 (Rust 铁血版) CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'
  RUST_VERSION: 'stable'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-frontend:
    name: Build Frontend (ES5 降级网页壳)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dependency Cache (Node Modules)
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./package-lock.json') }}

      - name: Build Frontend (ES5 强硬降级)
        run: |
          npm install
          npm run build
        continue-on-error: true

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: build-frontend
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: ia32
            target: i686-pc-windows-msvc
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'core-backend -> target'

      - name: Build Rust Backend (物理嵌入与底层交叉编译)
        run: |
          cd core-backend
          cargo build --release --target ${{ matrix.target }} --bin sovereign-core-exe
        continue-on-error: true

      - name: Rename Artifact
        run: |
          $Tag = "${{ github.ref_name }}"
          if ($Tag -notmatch "^v") { $Tag = "nightly" }
          $Ext = ".exe"
          $TargetDir = "core-backend\target\${{ matrix.target }}\release"
          $OriginalExe = "$TargetDir\sovereign-core-exe$Ext"
          $NewName = "SovereignNote_${Tag}_windows_${{ matrix.arch }}$Ext"

          if (Test-Path $OriginalExe) {
            Rename-Item -Path $OriginalExe -NewName $NewName
            echo "EXECUTABLE_NAME=$NewName" >> $env:GITHUB_ENV
          } else {
            echo "Executable not found! Skipping rename."
          }
        shell: powershell
        continue-on-error: true

      - name: Upload Windows Architecture Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignNote_Windows_${{ matrix.arch }}
          path: core-backend/target/${{ matrix.target }}/release/SovereignNote_*.exe
          if-no-files-found: ignore

  build-android:
    name: Build Android (APK)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK & SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 30
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Setup Rust Toolchain (Android Targets)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'core-backend -> target'

      - name: Install cargo-apk Tool
        run: cargo install cargo-apk

      - name: Build Android APK
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cd core-backend
          # 动态剔除 [[bin]] 单元阻碍使得 cargo-apk 顺利作为 pure-library 进行编译，杜绝 Cdylib 冲突
          sed -i '/\[\[bin\]\]/,/path = "src\/main.rs"/d' Cargo.toml
          cargo apk build --lib
        continue-on-error: true

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignNote_Android_APK
          path: core-backend/target/debug/apk/*.apk
          if-no-files-found: ignore

  release-publish:
    name: Auto Release (资产分发)
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SovereignNote_Windows_x64
          path: artifacts/Windows_x64

      - name: Download Windows ia32 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SovereignNote_Windows_ia32
          path: artifacts/Windows_ia32

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SovereignNote_Android_APK
          path: artifacts/Android

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Windows_x64/*
            artifacts/Windows_ia32/*
            artifacts/Android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
